<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b43">
<meta name="robots" content="noindex">
<title>税金・手取り計算</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #edf2f8;
  font-family: system-ui, -apple-system, sans-serif;
  color: #172b43;
}

body {
  padding: 6px;
}

main {
  width: 100%;
  max-width: 378px;
  margin: 0 auto;
  background: #fff;
  padding: 9px 11px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #172b4312;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

h1 {
  font-size: 14px;
  margin: 0;
  line-height: 1.2;
}

.reset-btn {
  padding: 4px 9px;
  border: 0;
  border-radius: 6px;
  background: #172b43;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
}

label {
  display: block;
  font-size: 10.5px;
  font-weight: 650;
  color: #4a5568;
  line-height: 1.2;
}

input {
  width: 100%;
  padding: 5px 7px;
  margin-top: 2px;
  font-size: 16px;
  line-height: 1.2;
  border: 1px solid #ccd5e0;
  border-radius: 6px;
  background: #fff;
}

.profit-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  align-items: end;
  margin-bottom: 6px;
}

.loss-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-bottom: 6px;
}

.summary {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-size: 10.5px;
  line-height: 1.25;
  padding: 5px 7px;
  background: #f8fafc;
  border-radius: 6px;
  margin-bottom: 6px;
}

.summary strong {
  font-size: 11.5px;
}

.result {
  background: #f1f5fa;
  border-radius: 8px;
  padding: 7px 9px;
}

.res-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}

.res-row + .res-row {
  border-top: 1px solid #dce3eb;
  margin-top: 5px;
  padding-top: 5px;
}

.caption {
  font-size: 10.5px;
  color: #64748b;
  line-height: 1.2;
}

.value {
  font-size: 15px;
  font-weight: 750;
  line-height: 1.2;
  text-align: right;
  white-space: nowrap;
}

.tax, .loss {
  color: #dc5555;
}

.net {
  color: #13976b;
}

.note {
  font-size: 9.5px;
  color: #718096;
  line-height: 1.25;
  margin-top: 6px;
}
</style>
</head>

<body>

<main>

<div class="top">
  <h1>税金・手取り計算（20.315%）</h1>
  <button class="reset-btn" type="button" onclick="resetCalc()">クリア</button>
</div>

<div class="profit-row">
  <div>
    <label for="profit">① 累計確定利益（円）</label>
    <input id="profit" type="number" inputmode="decimal" placeholder="1000000" oninput="calc()">
  </div>
  <div>
    <label>差引後利益</label>
    <input id="adjustedBox" type="text" value="0 円" readonly tabindex="-1" style="background:#f8fafc;font-size:13px;padding:7px 7px;font-weight:700;">
  </div>
</div>

<label style="margin-bottom:2px;">② マイナス分（円・プラス入力）</label>
<div class="loss-grid">
  <div>
    <label for="loss1">マイナス①</label>
    <input id="loss1" type="number" inputmode="decimal" placeholder="100000" oninput="calc()">
  </div>
  <div>
    <label for="loss2">マイナス②</label>
    <input id="loss2" type="number" inputmode="decimal" placeholder="50000" oninput="calc()">
  </div>
  <div>
    <label for="loss3">マイナス③</label>
    <input id="loss3" type="number" inputmode="decimal" placeholder="30000" oninput="calc()">
  </div>
</div>

<div class="summary">
  <span>マイナス合計</span>
  <strong class="loss" id="lossTotal">0 円</strong>
</div>

<div class="result">
  <div class="res-row">
    <span class="caption">③ 税金目安（調整後×20.315%）</span>
    <span class="value tax" id="tax">0 円</span>
  </div>
  <div class="res-row">
    <span class="caption">④ 確定利益ベース手取り</span>
    <span class="value net" id="net">0 円</span>
  </div>
  <div class="res-row">
    <span class="caption">⑤ マイナス考慮後手取り</span>
    <span class="value net" id="estimated">0 円</span>
  </div>
</div>

<div class="note">
※国内FX申告分離課税の概算。⑤は資金管理上の参考値（含み損は原則損益通算外・海外FX対象外）。
</div>

</main>

<script>

  if (!el) return 0;
